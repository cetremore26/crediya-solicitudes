pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

buildCache {
    local {
        directory = new File(rootDir, 'build-cache')
    }
}

rootProject.name = 'Solicitudes'

include ':app-service'
include ':model'
include ':usecase'
include ':entry-points'
include ':solicitud-repository'
include ':usuarios-client'
include ':jwt-verifier'
project(':app-service').projectDir = file('./applications/app-service')
project(':model').projectDir = file('./domain/model')
project(':usecase').projectDir = file('./domain/usecase')
project(':entry-points').projectDir = file('./infrastructure/entry-points')
project(':solicitud-repository').projectDir = file('./infrastructure/driven-adapters/solicitud-repository')
project(':usuarios-client').projectDir = file('./infrastructure/driven-adapters/usuarios-client')
project(':jwt-verifier').projectDir = file('./infrastructure/driven-adapters/jwt-verifier')
