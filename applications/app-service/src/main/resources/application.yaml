##Spring Configuration
server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: Solicitudes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/crediya_solicitudes}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:crediya}
    password: ${DB_PASSWORD:crediya_solicitudes_pass}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}
  sql:
    init:
      mode: always
  devtools:
    add-properties: false
usuarios:
  service:
    url: ${USUARIOS_SERVICE_URL:http://localhost:8080}
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
