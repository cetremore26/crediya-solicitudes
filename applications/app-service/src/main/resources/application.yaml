##Spring Configuration
server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: Solicitudes
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/crediya-solicitudes;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: /h2
usuarios:
  service:
    url: ${USUARIOS_SERVICE_URL:http://localhost:8080}
