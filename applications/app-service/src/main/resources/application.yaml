##Spring Configuration
server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: crediya-solicitudes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/crediya_solicitudes}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:crediya}
    # Sin valor por defecto: el servicio no arranca si falta (ver perfil local).
    password: ${DB_PASSWORD}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    open-in-view: false
    hibernate:
      # Hibernate solo valida que las entidades coincidan con el esquema de Flyway.
      ddl-auto: ${DB_DDL_AUTO:validate}
  flyway:
    locations: classpath:db/migration
    # Bases creadas antes de Flyway (con schema.sql) se registran en la versión 1.
    baseline-on-migrate: true
    baseline-version: 1
  devtools:
    add-properties: false
usuarios:
  service:
    url: ${USUARIOS_SERVICE_URL:http://localhost:8080}
jwt:
  # Claves públicas (JWKS) del servicio de autenticación para verificar los tokens RS256.
  jwks-uri: ${JWT_JWKS_URI:${usuarios.service.url}/.well-known/jwks.json}
  # Con HTTP plano, quien intercepte la descarga podría colar su propia clave y falsificar
  # tokens. Solo se permite en desarrollo o dentro de una red privada de confianza.
  allow-insecure-jwks-uri: ${JWT_ALLOW_INSECURE_JWKS_URI:false}
springdoc:
  # La documentación OpenAPI solo se publica si se pide (el perfil local la activa).
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
management:
  # Solo se publica el estado de salud (lo usan Docker y docker-compose).
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
