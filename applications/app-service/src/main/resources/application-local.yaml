# Perfil solo para desarrollo local: SPRING_PROFILES_ACTIVE=local
# Trae valores de desarrollo para lo que en application.yaml es obligatorio.
# Nunca activar este perfil en producción.
spring:
  datasource:
    password: ${DB_PASSWORD:crediya_solicitudes_pass}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
jwt:
  # En local el servicio de autenticación se expone por HTTP.
  allow-insecure-jwks-uri: true
